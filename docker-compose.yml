services:
  frontend:
    build:
      context: ./apps/frontend
    ports:
      - "5173:5173"
    depends_on:
      todo-api:
        condition: service_healthy
      user-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173/"]
      interval: 10s
      timeout: 5s
      retries: 5

  todo-api:
    build:
      context: ./apps/todo-api
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      USER_API_URL: http://user-api:4002
      SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      user-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4001/health', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-api:
    build:
      context: ./apps/user-api
    ports:
      - "4002:4002"
    environment:
      PORT: 4002
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      TOKEN_ISSUER: user-api
      TOKEN_AUDIENCE: todo-api
      SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4002/health', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
