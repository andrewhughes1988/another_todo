services:
  frontend:
    build:
      context: ./apps/frontend
    ports:
      - "5173:5173"
    environment:
      VITE_TODO_API_URL: http://localhost:4001
      VITE_USER_API_URL: http://localhost:4002
    depends_on:
      - todo-api
      - user-api

  todo-api:
    build:
      context: ./apps/todo-api
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
      DATABASE_URL: postgres://todo:todo@postgres:5432/todo
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

  user-api:
    build:
      context: ./apps/user-api
    ports:
      - "4002:4002"
    environment:
      PORT: 4002
      DATABASE_URL: postgres://todo:todo@postgres:5432/todo
    depends_on:
      - postgres

  notification-worker:
    build:
      context: ./apps/notification-worker
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:

