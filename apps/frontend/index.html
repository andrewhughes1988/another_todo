<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud Native To-Do</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="container">
    <h1>Cloud Native To-Do</h1>

    <form id="todo-form" novalidate>
      <label class="sr-only" for="todo-input">Task</label>
      <input
        id="todo-input"
        type="text"
        placeholder="Add a task"
        autocomplete="off"
        maxlength="120"
        required
        aria-describedby="todo-error"
      />
      <button type="submit">Add</button>
    </form>
    <p id="todo-error" class="form-error" role="alert"></p>

    <ul id="todo-list"></ul>
  </main>

  <script src="./app.js"></script>
</body>
</html>
