<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>to-do app</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Space+Grotesk:wght@600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="container">
    <section class="app-shell" aria-labelledby="app-title">
      <header class="app-header">
        <div class="header-top">
          <p class="eyebrow">Today</p>
          <nav class="nav-actions" aria-label="Account and display">
            <span id="auth-status" class="auth-status">Signed out</span>
            <button id="login-button" class="secondary-button compact-button" type="button">Sign in</button>
            <button id="register-button" class="compact-button" type="button">Register</button>
            <button id="logout-button" class="secondary-button compact-button" type="button" hidden>Sign out</button>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">
              <i data-lucide="moon" aria-hidden="true"></i>
              <span>Dark</span>
            </button>
          </nav>
        </div>
        <div>
          <h1 id="app-title">to-do app</h1>
          <p class="intro">Keep the next thing clear, small, and ready to ship.</p>
        </div>
      </header>

      <form id="todo-form" novalidate>
        <label class="sr-only" for="todo-input">Task</label>
        <input
          id="todo-input"
          type="text"
          placeholder="Add a task"
          autocomplete="off"
          maxlength="240"
          required
          aria-describedby="todo-error"
        />
        <button class="add-task" type="submit">
          <i data-lucide="plus" aria-hidden="true"></i>
          <span>Add task</span>
        </button>
      </form>
      <p id="todo-error" class="form-error" role="alert"></p>

      <div class="list-header">
        <h2>Tasks</h2>
        <span id="todo-count">0 open</span>
      </div>

      <p id="empty-state" class="empty-state">No tasks yet. Add one small thing to get moving.</p>
      <ul id="todo-list"></ul>
    </section>
  </main>

  <div id="auth-modal" class="modal-backdrop" hidden>
    <section
      class="auth-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="auth-modal-title"
      aria-describedby="auth-error"
    >
      <div class="modal-header">
        <h2 id="auth-modal-title">Sign in</h2>
        <button id="auth-close-button" class="icon-button" type="button" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <form id="auth-form" class="auth-form" novalidate>
        <label class="sr-only" for="email-input">Email</label>
        <input
          id="email-input"
          type="email"
          placeholder="Email"
          autocomplete="email"
          maxlength="255"
          required
          aria-describedby="auth-error"
        />
        <label class="sr-only" for="password-input">Password</label>
        <input
          id="password-input"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
          maxlength="128"
          required
          aria-describedby="auth-error"
        />
        <button id="auth-submit-button" type="submit">Sign in</button>
      </form>
      <p id="auth-error" class="form-error" role="alert"></p>
    </section>
  </div>

  <script src="./app.js"></script>
</body>
</html>
